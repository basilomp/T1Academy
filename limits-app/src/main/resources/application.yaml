server:
  port: 8084
  servlet:
    context-path: "/limits-app"
spring:
  application:
    name: limits-app
  datasource:
    url: jdbc:postgresql://localhost:5432/t1_db
    password: postgres
    username: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    schemas: limits_schema

application:
  scheduler:
    limits:
      reset-interval: 0 0 0 * * *